# Azure App Service (Linux, PHP 8) nginx server block, adapted from the stock
# image config: docroot moved to public/ and every non-file request routed
# through the front controller (public/index.php). Installed by startup.sh.
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot/public;
    index index.php index.html index.htm hostingstart.html;
    port_in_redirect off;

    # Room photo uploads are capped at 5 MB by RoomPhotoManager. nginx defaults
    # to 1 MB, which rejected any ordinary phone photo with a bare nginx "413
    # Request Entity Too Large" page before PHP ever ran — so the app's own
    # friendly message never had a chance to appear. Deliberate headroom above
    # 5 MB: multipart adds boundary overhead, and we want the application limit
    # to be the one that speaks, not the web server.
    client_max_body_size 8m;

    # Front controller: serve a real file if it exists, otherwise hand EVERY
    # request to public/index.php. Never resolve /admin/foo/ to that folder's
    # index.php (that bypasses the router -> "No direct access").
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Serve real static assets (css/js/room images) directly from public/.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|mp4|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;   # AI calls can take 10-25s — don't cut them off
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Never serve dotfiles (.env, .git) or the vendor/src trees over HTTP.
    location ~ /\. { deny all; }
}
